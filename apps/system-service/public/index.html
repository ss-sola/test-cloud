<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="NestCloud 系统管理台，提供统一的系统工作区入口。"
    />
    <title>系统管理台 · NestCloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Lato:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/public/css/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="系统管理台导航">
        <div class="brand-block">
          <a class="brand" href="#overview" aria-label="返回工作台总览">
            <span class="brand-mark" aria-hidden="true">N</span>
            <span>
              <strong class="brand-name">NestCloud</strong>
              <span class="brand-caption">SYSTEM CONSOLE</span>
            </span>
          </a>
          <button
            class="sidebar-collapse-button"
            id="sidebar-collapse-button"
            type="button"
            aria-controls="sidebar"
            aria-expanded="true"
            aria-label="收起导航"
            title="收起导航"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M15 5 8 12l7 7M9 12h11" />
            </svg>
          </button>
        </div>

        <nav class="primary-nav" aria-label="主导航">
          <p class="nav-label">工作区</p>
          <a class="nav-link" href="#overview" data-route="overview">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" />
            </svg>
            <span>工作台总览</span>
          </a>
          <a class="nav-link" href="#particle" data-route="particle">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <circle cx="6" cy="8" r="1.5" />
              <circle cx="17" cy="6" r="1.5" />
              <circle cx="12" cy="17" r="1.5" />
              <path d="m7.4 8.5 8.2-2M7 9.4l4 6.2m2.2.1 3.1-8.1" />
            </svg>
            <span>粒子动画</span>
          </a>
          <a class="nav-link" href="#json-compare" data-route="json-compare">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M5 5h6v6H5zM13 13h6v6h-6zM13 5h6M5 19h6" />
            </svg>
            <span>JSON 对比</span>
          </a>
          <a class="nav-link" href="#env-compare" data-route="env-compare">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M6 5h12M6 12h12M6 19h12M9 3v4M15 10v4M10 17v4" />
            </svg>
            <span>ENV 对比</span>
          </a>
          <a class="nav-link" href="#weekly-report" data-route="weekly-report">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4" />
            </svg>
            <span>周报生成</span>
          </a>
          <a class="nav-link" href="#config-file-preview" data-route="config-file-preview">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M5 4h14v16H5zM8 8h8M8 12h5M8 16h8" />
            </svg>
            <span>配置版本预览</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="service-status">
            <span class="status-pulse" aria-hidden="true"></span>
            <span>
              <strong>静态管理台</strong>
              <small>本地工具已就绪</small>
            </span>
          </div>
          <span class="version-label">SYSTEM / 0.1</span>
        </div>
      </aside>

      <div class="sidebar-scrim" data-sidebar-close></div>

      <div class="content-shell">
        <header class="topbar">
          <div class="topbar-leading">
            <button
              class="mobile-menu-button"
              id="mobile-menu-button"
              type="button"
              aria-label="打开导航菜单"
              aria-controls="sidebar"
              aria-expanded="false"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <div class="breadcrumbs" aria-label="当前位置">
              <span>系统管理台</span>
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path d="m9 5 7 7-7 7" />
              </svg>
              <strong id="breadcrumb-current">工作台总览</strong>
            </div>
          </div>
          <div class="topbar-meta">
            <span class="environment-chip"><span class="environment-dot"></span>本地环境</span>
            <span class="topbar-divider" aria-hidden="true"></span>
            <span class="topbar-date">NestCloud Console</span>
          </div>
        </header>

        <main id="main-content" class="main-content" tabindex="-1">
          <div id="view-host" aria-live="polite"></div>
        </main>
      </div>
    </div>

    <script src="/public/js/env-parser.js" defer></script>
    <script src="/public/js/json-diff.js" defer></script>
    <script src="/public/js/image-particles.js" defer></script>
    <script src="/public/js/particle-field.js" defer></script>
    <script src="/public/js/config-file-preview.js" defer></script>
    <script src="/public/js/app.js" defer></script>
  </body>
</html>
